services:
  ideavault:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:?APP_PORT must be set}:3000"
    volumes:
      - ideavault-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  ideavault-data:
    name: usefulapps-ideavault-data
