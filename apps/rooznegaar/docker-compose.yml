services:
  planner:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:?APP_PORT must be set}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - planner-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  planner-data:
    name: usefulapps-rooznegaar-data
